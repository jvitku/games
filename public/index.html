<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webcam Hockey Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Webcam Space Shooter</h1>
            <div class="score">
                <span>Score: <span id="playerScore">0</span></span>
                <span>Time: <span id="aiScore">60</span></span>
            </div>
        </header>
        
        <div class="game-area">
            <canvas id="gameCanvas" width="800" height="600"></canvas>
            <div class="controls">
                <button id="startBtn">Start Game</button>
                <button id="calibrateBtn">Calibrate</button>
                <button id="resetBtn">Reset</button>
            </div>
            <div class="speed-control">
                <label for="speedSlider">Game Speed:</label>
                <input type="range" id="speedSlider" min="0.5" max="10" step="0.1" value="1">
                <span id="speedValue">1.0x</span>
            </div>
        </div>
        
        <div class="webcam-area">
            <div class="camera-container">
                <video id="webcam" width="640" height="480" autoplay muted style="position: absolute; opacity: 0; pointer-events: none;"></video>
                <canvas id="trackingCanvas" width="640" height="480"></canvas>
                <div class="tracking-overlay">
                    <!-- Crosshair removed -->
                </div>
            </div>
            <div class="tracking-info">
                <p>Ball Position: <span id="ballPos">Not detected</span></p>
                <p>Status: <span id="status">Initializing...</span></p>
                <p>Tracking Quality: <span id="trackingQuality">0%</span></p>
            </div>
        </div>
    </div>
    
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="game.js"></script>
    <script src="tracking.js"></script>
    <script async src="https://docs.opencv.org/4.5.0/opencv.js" onload="onOpenCvReady();" type="text/javascript"></script>
</body>
</html>
